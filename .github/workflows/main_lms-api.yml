name: Build and deploy NestJS API to Azure Web App - lms-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install & Build API
        run: |
          cd apps/api
          npm install
          npm run build

      # optional: run tests if you have them
      #- name: Run tests
      #  run: |
      #    cd apps/api
      #    npm run test

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact
          path: apps/api/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: api-artifact
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5E07153E9FD94962BBB8237F51C70793 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9C577F5E81934CB3B5F5C82F071D4485 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3BC1FC95176F48DFA8C635F35F0894C7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lms-api'
          slot-name: 'Production'
          package: apps/api
