services:
  app:
    build: ./apps/api
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/lms-db
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      - mongo
    networks:
      - lms-network
  web:
    build: ./apps/web
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://app:3000
    depends_on:
      - app
    networks:
      - lms-network

  mongo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - lms-network
volumes:
  mongo_data:

networks:
  lms-network:
    driver: bridge



